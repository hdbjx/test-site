<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
<defs>
<linearGradient id="loopL" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f7d50"/><stop offset=".45" stop-color="#3f9a63"/><stop offset="1" stop-color="#174a30"/></linearGradient>
<linearGradient id="loopR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7d50"/><stop offset=".45" stop-color="#46a56c"/><stop offset="1" stop-color="#174a30"/></linearGradient>
<linearGradient id="tail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f5a3a"/><stop offset="1" stop-color="#2f7d50"/></linearGradient>
<radialGradient id="knot" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#4fb276"/><stop offset=".6" stop-color="#2a6e46"/><stop offset="1" stop-color="#143f29"/></radialGradient>
<clipPath id="cl"><path d="M100 64 C 78 26, 22 14, 16 44 C 10 76, 62 88, 100 64 Z"/></clipPath><clipPath id="cr"><path d="M100 64 C 122 26, 178 14, 184 44 C 190 76, 138 88, 100 64 Z"/></clipPath>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1a0c0a" flood-opacity=".35"/></filter>
</defs>
<g filter="url(#sh)">
  <!-- tails -->
  <path d="M93 70 C 86 92, 76 112, 62 140 L 74 133 L 80 146 C 92 118, 100 94, 104 72 Z" fill="url(#tail)" stroke="#e3c26b" stroke-width="1" stroke-linejoin="round"/>
  <path d="M107 70 C 114 92, 124 112, 138 140 L 126 133 L 120 146 C 108 118, 100 94, 96 72 Z" fill="url(#tail)" stroke="#e3c26b" stroke-width="1" stroke-linejoin="round"/>
  <!-- loops -->
  <path d="M100 64 C 78 26, 22 14, 16 44 C 10 76, 62 88, 100 64 Z" fill="url(#loopL)" stroke="#e3c26b" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M100 64 C 122 26, 178 14, 184 44 C 190 76, 138 88, 100 64 Z" fill="url(#loopR)" stroke="#e3c26b" stroke-width="1.1" stroke-linejoin="round"/>
  <!-- loop inner folds -->
  <path d="M96 62 C 76 40, 44 34, 36 48 C 30 60, 62 70, 96 62 Z" fill="#123a26" opacity=".55"/>
  <path d="M104 62 C 124 40, 156 34, 164 48 C 170 60, 138 70, 104 62 Z" fill="#123a26" opacity=".55"/>
  <!-- sheen -->
  <g clip-path="url(#cl)"><path d="M90 50 C 70 32, 40 26, 26 38" stroke="#ffffff" stroke-opacity=".32" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M98 64 C 70 58, 46 62, 30 70" stroke="#0e2e1e" stroke-opacity=".35" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  <g clip-path="url(#cr)"><path d="M110 50 C 130 32, 160 26, 174 38" stroke="#ffffff" stroke-opacity=".26" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M102 64 C 130 58, 154 62, 170 70" stroke="#0e2e1e" stroke-opacity=".35" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  <!-- knot -->
  <rect x="86" y="50" width="28" height="30" rx="9" fill="url(#knot)" stroke="#e3c26b" stroke-width="1.1"/>
  <path d="M92 57 C 96 54, 104 54, 108 57" stroke="#ffffff" stroke-opacity=".4" stroke-width="2" fill="none" stroke-linecap="round"/>
</g>
</svg>
